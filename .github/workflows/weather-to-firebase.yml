# Put this file in your repository at .github/workflows/weather-to-firebase.yml
# and weather_to_firebase.py in the repository root.
# Add two repository secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT_JSON  (the whole service-account key file content)
#   FIREBASE_DATABASE_URL
name: weather-to-firebase
on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch: {}          # lets you press "Run workflow" to test it
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin
      - run: python weather_to_firebase.py
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
